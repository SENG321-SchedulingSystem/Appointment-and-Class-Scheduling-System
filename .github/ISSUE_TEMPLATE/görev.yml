name: 📌 Yeni Görev / Özellik
description: Projeye yeni bir özellik veya görev eklemek için bu formu kullanın.
title: "[Task]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: 📌 Görev veya Hata Açıklaması
      description: Lütfen eklenecek özelliği veya karşılaştığınız hatayı detaylıca açıklayın.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 🎯 Beklenen Sonuç
      description: Sistemden beklediğiniz doğru davranış nedir?
    validations:
      required: true

  - type: textarea
    id: dod
    attributes:
      label: 📋 Kabul Kriterleri (DoD - Definition of Done)
      description: Görevin tamamlanmış sayılması için gereken maddeleri yazın.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true