name: OpenAPI Lint Check

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  lint-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Redocly ile OpenAPI Kontrolü
        run: npx @redocly/cli lint openapi.yaml