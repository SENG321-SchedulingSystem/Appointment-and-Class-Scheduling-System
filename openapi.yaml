openapi: 3.1.0
info:
  title: Lesson Scheduling API
  version: 0.2.1
  description: API contract for managing users, instructor availability, and lesson appointments.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:3000
    description: Mock Development Server
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: User login (Obtains token)
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: "eren@example.com" }
                password: { type: string, example: "password123" }
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: "eyJhbGciOiJIUzI1NiIsInR5c..." }
                  role: { type: string, enum: [ADMIN, INSTRUCTOR, STUDENT], example: "STUDENT" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    post:
      summary: Creates a new user (Registration)
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewUser' }
      responses:
        '201':
          description: User successfully created
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email address is already in use (US-01)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: "Conflict"
                status: 409
                code: "EMAIL_ALREADY_EXISTS"
                detail: "This email address is already registered."

  /assignments:
    post:
      summary: Assigns a student to an instructor (US-02)
      operationId: assignStudent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Assignment' }
      responses:
        '201':
          description: Assignment successful
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /availability:
    get:
      summary: Retrieves availabilities within a specific date range (US-04)
      operationId: listAvailability
      parameters:
        - in: query
          name: instructorId
          required: true
          schema: { type: string, example: "inst_123" }
        - in: query
          name: from
          required: false
          schema: { type: string, format: date-time, example: "2026-11-01T09:00:00Z" }
        - in: query
          name: to
          required: false
          schema: { type: string, format: date-time, example: "2026-11-07T17:00:00Z" }
      responses:
        '200':
          description: Matching available slots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Student is not assigned to this instructor or lacks permission
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: "Forbidden"
                status: 403
                code: "INSTRUCTOR_NOT_ASSIGNED"
                detail: "You are not authorized to view the availability of an instructor who is not assigned to you."
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Instructor adds new availability
      operationId: addAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewAvailability' }
      responses:
        '201':
          description: Availability added
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /appointments:
    post:
      summary: Creates a new appointment (Student ID taken from token)
      operationId: createAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewAppointment' }
      responses:
        '201':
          description: Appointment successfully created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Student is not assigned to this instructor or lacks permission
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: "Forbidden"
                status: 403
                code: "INSTRUCTOR_NOT_ASSIGNED"
                detail: "You are not authorized to book an appointment with an instructor who is not assigned to you."
        '404':
          description: Requested availability slot not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: "Not Found"
                status: 404
                code: "SLOT_NOT_FOUND"
                detail: "The requested availability slot does not exist in the system."
        '409':
          description: Selected slot is already booked
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: "Conflict"
                status: 409
                code: "SLOT_UNAVAILABLE"
                detail: "This slot is already booked."

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    NewUser:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string, example: "Eren Okat" }
        email: { type: string, format: email, example: "eren@example.com" }
        role: { type: string, enum: [ADMIN, INSTRUCTOR, STUDENT], example: "STUDENT" }
    Assignment:
      type: object
      required: [studentId, instructorId]
      properties:
        studentId: { type: string, example: "stu_456" }
        instructorId: { type: string, example: "inst_123" }
    Availability:
      type: object
      required: [id, instructorId, startTime, endTime]
      properties:
        id: { type: string, example: "avail_789" }
        instructorId: { type: string, example: "inst_123" }
        startTime: { type: string, format: date-time, example: "2026-11-01T10:00:00Z" }
        endTime: { type: string, format: date-time, example: "2026-11-01T11:00:00Z" }
    NewAvailability:
      type: object
      required: [startTime, endTime]
      properties:
        startTime: { type: string, format: date-time, example: "2026-11-01T10:00:00Z" }
        endTime: { type: string, format: date-time, example: "2026-11-01T11:00:00Z" }
    NewAppointment:
      type: object
      required: [availabilityId]
      properties:
        availabilityId: { type: string, example: "avail_789" }
    Appointment:
      allOf:
        - $ref: '#/components/schemas/NewAppointment'
        - type: object
          required: [id, status, studentId]
          properties:
            id: { type: string, example: "apt_321" }
            studentId: { type: string, example: "stu_456" }
            status:
              type: string
              enum: [SCHEDULED, CANCELLED, COMPLETED]
              example: "SCHEDULED"
    Problem:
      type: object
      required: [title, status, code]
      properties:
        title: { type: string, example: "Error Title" }
        status: { type: integer, example: 400 }
        code: { type: string, example: "ERROR_CODE" }
        detail: { type: string, example: "Human-readable explanation of the error." }

  responses:
    BadRequest:
      description: Missing or invalid request parameters
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid token (Not logged in)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            title: "Unauthorized"
            status: 401
            code: "UNAUTHORIZED"
            detail: "Authentication credentials are missing or invalid."
    Forbidden:
      description: Insufficient permission to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            title: "Forbidden"
            status: 403
            code: "FORBIDDEN"
            detail: "You do not have permission to access this resource."
    NotFound:
      description: Requested resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            title: "Not Found"
            status: 404
            code: "RESOURCE_NOT_FOUND"
            detail: "The requested user or ID does not exist in the system."