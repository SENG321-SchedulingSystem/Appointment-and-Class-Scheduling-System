name: 🐛 Bug Report
description: Report an error or unexpected behavior in the system.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 🐛 Bug Description
      description: What is the bug? What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 🔄 Steps to Reproduce
      description: Exactly what steps did you take before encountering the bug?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 🎯 Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true